<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIP Client | Numero Control Panel</title>
<style>
:root{--line:#e1e5e9;--blue:#717bdc;--link:#4b8bda;--ink:#24344a}*{box-sizing:border-box}body{margin:0;background:#f2f2f2;color:#344155;font-family:'Open Sans',Arial,sans-serif;font-size:12px}.page{margin:23px 22px;background:#fff;min-height:calc(100vh - 47px);padding:48px 16px 32px;box-shadow:0 0 3px #ddd}h1{font-weight:400;font-size:24px;margin:0 0 25px;color:#26364a}.rule{border-top:1px solid var(--line);margin:0 0 8px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 22px}.field label{display:block;font-size:11px;font-weight:700;color:#111d2c;margin-bottom:7px}.field input,.field select{border:1px solid #dbe0e6;border-radius:3px;width:100%;height:37px;padding:0 12px;color:#748199;font:12px Arial,sans-serif;background:#fff;outline-color:#7e8be2}.field input::placeholder{color:#a6afbd}.actions{display:flex;align-items:end;gap:8px}.btn{height:35px;border:0;border-radius:3px;padding:0 14px;cursor:pointer;font-size:12px}.btn.primary{background:#727cde;color:#fff;font-weight:600}.btn.secondary{background:#e8eaed;color:#344155}.btn:hover{filter:brightness(.97)}.filter-bottom{display:flex;justify-content:space-between;align-items:center;margin:17px 0 17px;gap:12px;flex-wrap:wrap}.per-page select{border:1px solid var(--line);border-radius:3px;background:white;color:#7d85a0;height:30px;padding:0 6px;margin-right:5px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1150px;table-layout:auto}th,td{border:1px solid #dde2e7;padding:10px 9px;white-space:nowrap;text-align:left;font-size:11px}th{font-weight:700;color:#505969;position:relative;background:#fff;cursor:pointer;padding-right:17px}th:after{content:'♦';font-size:10px;color:#e1e4e8;position:absolute;right:5px;top:10px}th.active:after{color:#7884df}td{color:#8290a6;height:39px}tbody tr:hover{background:#fbfbff}a{color:#4b8cdb;text-decoration:none}a:hover{text-decoration:underline}.empty{text-align:center;padding:30px}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;color:#7c889b}.pages{display:flex;align-items:center;gap:4px}.pages button{border:1px solid #e0e4e8;background:white;color:#7b87a0;padding:7px 11px;cursor:pointer;border-radius:3px}.pages button.current{background:#747edf;color:white;border-color:#747edf}.pages button:disabled{opacity:.5;cursor:default}.gold{color:#556b83;font-weight:400}.value{color:#556b83}@media(max-width:850px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.page{margin:10px;padding:24px 12px}}@media(max-width:500px){.filters{grid-template-columns:1fr}}

/* Numero eSIM control panel navigation, matching supplied reference */
.topbar{height:63px;background:linear-gradient(104deg,#08a0d3 0%,#245ab4 23%,#4e2f98 47%,#910071 75%,#ac0053 100%);display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:white}
.brandarea,.userarea{display:flex;align-items:center;gap:23px}
.brand{color:#fff;text-decoration:none!important;white-space:nowrap;font-size:26px;line-height:1;letter-spacing:-1.2px;display:flex;align-items:baseline}
.brand strong{font-size:31px;font-weight:800;letter-spacing:-2px;color:#fff}
.brand span{font-size:23px;font-weight:400;letter-spacing:-1px;color:#fff;margin-left:4px}
.topbell{color:#fff;font-size:20px;line-height:1}
.avatar{height:36px;width:36px;border-radius:50%;border:4px solid #618be5;background:#f5f7fb;display:flex;justify-content:center;align-items:center;color:#2761b3;font-weight:900;font-size:22px}
.username{font-weight:700;color:#fff;font-size:13px}
.sectionbar{height:61px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 43px}
.sectiontitle{font-size:15px;font-weight:750;color:#253344}
.breadcrumb{font-size:12px;color:#a2aabe}.breadcrumb a{color:#9ba4b7;text-decoration:none}.breadcrumb .current{color:#ff4d4e}.breadcrumb .slash{padding:0 12px;color:#ccd0d7}
.page{margin-top:25px;padding-top:48px}
@media(max-width:650px){.topbar{padding:0 15px}.brand{font-size:18px}.brand strong{font-size:24px}.brand span{font-size:17px}.brandarea,.userarea{gap:12px}.username{font-size:11px}.sectionbar{padding:0 16px}.breadcrumb{font-size:10px}}

const columns=[['id','Client ID'],['number','Client Number'],['active','Total Active Numbers'],['balance','Total Balance'],['data','Total Data'],['esim','Total Full eSIM'],['investment','Total Investment'],['assigned','Assigned By'],['added','VIP Added At'],['purchase','Last Purchase']];
const $=id=>document.getElementById(id);let filtered=[...records],page=1,order='added',ascending=false;
$('header').innerHTML=columns.map(([key,label])=>`<th data-key="${key}" tabindex="0">${label}</th>`).join('');
const range=(val,filter)=>!filter||filter==='0'&&val===0||filter==='21+'&&val>=21||filter==='1000+'&&val>1000||(/-/.test(filter)&&val>=+filter.split('-')[0]&&val<=+filter.split('-')[1]);
function apply(){let q=$('client').value.trim().toLowerCase();filtered=records.filter(r=>(!q||r.id.includes(q)||r.number.includes(q))&&(!$('assigned').value||r.assigned===$('assigned').value)&&(!$('vipFrom').value||r.added>=$('vipFrom').value)&&(!$('vipTo').value||r.added<=$('vipTo').value)&&(!$('purchaseFrom').value||r.purchase>=$('purchaseFrom').value)&&(!$('purchaseTo').value||r.purchase<=$('purchaseTo').value)&&range(r.investment,$('investment').value)&&range(r.active,$('numbers').value));page=1;draw()}
function draw(){const list=[...filtered].sort((a,b)=>{let x=a[order],y=b[order];return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*(ascending?1:-1)});let limit=+$('perPage').value,total=Math.max(1,Math.ceil(list.length/limit));page=Math.min(page,total);const shown=list.slice((page-1)*limit,page*limit);$('body').innerHTML=shown.map(r=>`<tr>${columns.map(([k])=>{let v=r[k];if(k==='id'||k==='number')return `<td><a href="numero_vip_client_add_remove.html" title="View client profile (demo)">${v}</a></td>`;if(k==='balance'||k==='investment')v='€'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});if(k==='added'||k==='purchase')v=v.split('-').reverse().join('/');return `<td class="${k==='investment'?'gold':'value'}">${v}</td>`}).join('')}</tr>`).join('')||'<tr><td class="empty" colspan="10">No matching VIP clients found.</td></tr>';
$('count').textContent=`Showing ${list.length?(page-1)*limit+1:0} to ${Math.min(page*limit,list.length)} of ${list.length} entries`;
$('pages').innerHTML=`<button ${page===1?'disabled':''} data-page="${page-1}">Previous</button>`+Array.from({length:total},(_,i)=>`<button class="${page===i+1?'current':''}" data-page="${i+1}">${i+1}</button>`).join('')+`<button ${page===total?'disabled':''} data-page="${page+1}">Next</button>`;
document.querySelectorAll('th').forEach(th=>th.classList.toggle('active',th.dataset.key===order))}
$('apply').onclick=apply;$('reset').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach(el=>el.value='');apply()};$('perPage').onchange=()=>{page=1;draw()};$('pages').onclick=e=>{if(e.target.dataset.page){page=+e.target.dataset.page;draw()}};$('header').onclick=e=>{let th=e.target.closest('th');if(th){ascending=order===th.dataset.key?!ascending:true;order=th.dataset.key;draw()}};$('header').onkeydown=e=>{if(e.key==='Enter'){e.target.click()}};draw();

$('export').onclick=()=>{
 const rows=[columns.map(([,label])=>label),...filtered.map(r=>columns.map(([k])=>r[k]))];
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\ufeff'+rows.map(row=>row.map(esc).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='vip-clients.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
